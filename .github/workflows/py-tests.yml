# Workflow that runs python tests
name: Run Python Tests

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ (github.head_ref && github.ref) || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-on-linux:
    name: Python Tests on Linux
    runs-on: ubuntu-24.04
    env:
      INSTALL_DOCKER: "0"
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install poetry via pipx
        run: pipx install poetry
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "poetry"
      - name: Install Python dependencies using Poetry
        run: |
          poetry install --with dev,test,runtime
          poetry run pip install pytest-xdist pytest-rerunfailures
      - name: Build Environment
        run: make build
      - name: Run Unit Tests
        run: PYTHONPATH=".:$PYTHONPATH" poetry run pytest --forked -n auto -s ./tests/unit --cov=openhands --cov-branch
        env:
          COVERAGE_FILE: ".coverage.${{ matrix['python-version'] }}"
      - name: Store coverage file
        uses: actions/upload-artifact@v7
        with:
          name: coverage-openhands
          path: |
            .coverage.${{ matrix['python-version'] }}
            .coverage.runtime.${{ matrix['python-version'] }}
          include-hidden-files: true

  critical-coverage:
    name: Critical Path Coverage
    runs-on: ubuntu-24.04
    env:
      OPENHANDS_SUPPRESS_BANNER: "1"
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v6
      - name: Install poetry via pipx
        run: pipx install poetry
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "poetry"
      - name: Install Python dependencies using Poetry
        run: poetry install --with dev,test,runtime
      - name: Run critical path coverage
        run: |
          PYTHONPATH=".:$PYTHONPATH" poetry run pytest -q \
            tests/unit/app_server/test_runtime_security.py \
            tests/unit/app_server/test_session_auth_critical_paths.py \
            tests/unit/app_server/test_auth_user_context_critical_paths.py \
            tests/unit/app_server/test_config_runtime_selection.py \
            tests/unit/app_server/test_config_event_service_selection.py \
            tests/unit/app_server/test_conversation_hook_loader.py \
            --cov=openhands.app_server.sandbox.runtime_security \
            --cov=openhands.app_server.sandbox.session_auth \
            --cov=openhands.app_server.user.auth_user_context \
            --cov=openhands.app_server.config \
            --cov=openhands.app_server.composition.llm_event_factories \
            --cov=openhands.app_server.composition.sandbox_factories \
            --cov=openhands.app_server.composition.app_service_factories \
            --cov=openhands.app_server.app_conversation.hook_loader \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=70
        env:
          COVERAGE_FILE: ".coverage.critical.${{ matrix['python-version'] }}"
      - name: Store critical coverage file
        uses: actions/upload-artifact@v7
        with:
          name: coverage-critical-openhands
          path: ".coverage.critical.${{ matrix['python-version'] }}"
          include-hidden-files: true

  test-enterprise:
    name: Enterprise Python Unit Tests
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v6
      - name: Install poetry via pipx
        run: pipx install poetry
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "poetry"
      - name: Install Python dependencies using Poetry
        working-directory: ./enterprise
        run: poetry install --with dev,test
      - name: Run Unit Tests
        run: PYTHONPATH=".:$PYTHONPATH" poetry run --project=enterprise pytest --forked -n auto -s -p no:ddtrace -p no:ddtrace.pytest_bdd -p no:ddtrace.pytest_benchmark ./enterprise/tests/unit --cov=enterprise --cov-branch
        env:
          COVERAGE_FILE: ".coverage.enterprise.${{ matrix['python-version'] }}"
      - name: Store coverage file
        uses: actions/upload-artifact@v7
        with:
          name: coverage-enterprise
          path: ".coverage.enterprise.${{ matrix['python-version'] }}"
          include-hidden-files: true

  coverage-comment:
    name: Coverage Comment
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [test-on-linux, critical-coverage, test-enterprise]
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        id: download
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Coverage comment
        id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@53ff7553078bad69030786e486677315346c2dd2 # v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MERGE_COVERAGE_FILES: true
