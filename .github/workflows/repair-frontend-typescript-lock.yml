name: Repair frontend TypeScript compatibility

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-frontend-typescript-lock.yml
      - frontend/package.json

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pin supported TypeScript and regenerate lock
        working-directory: frontend
        run: |
          npm pkg set 'devDependencies.typescript=^5.9.3'
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run lint
      - name: Commit regenerated dependency metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package.json frontend/package-lock.json
          git diff --cached --quiet || git commit -m 'fix(frontend): pin TypeScript to supported release'
          git push origin HEAD:main
