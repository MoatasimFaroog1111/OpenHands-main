name: Regenerate frontend lock for TypeScript compatibility

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate lock and verify frontend
        working-directory: frontend
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run lint
      - name: Commit lockfile if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package-lock.json
          git diff --cached --quiet || git commit -m 'fix(frontend): regenerate lock for TypeScript 5.9'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
